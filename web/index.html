<!DOCTYPE html>
<html>
<head>
  <!--

  <meta charset="UTF-8">

  <link rel="manifest" href="manifest.json">
  <style>
    /* CSS Reset untuk mencegah celah/garis putih subpixel pada browser/DevTools */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #12312E; /* Warna latar belakang canvas splash */
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Pastikan view flutter menutupi 100% tanpa outline atau border */
    flutter-view, flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
      outline: none !important;
      border: none !important;
    }
  </style>
